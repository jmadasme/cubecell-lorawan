name: Solicitud de acceso
description: Pedir acceso a una versión privada de CubeCell LoRaWAN.
title: "[Acceso] cubecell-lorawan"
labels: ["solicitud-acceso"]
body:
  - type: markdown
    attributes:
      value: |
        Este formulario pide acceso a una versión privada de **CubeCell LoRaWAN**.
        La primera versión (`CubeCell-LoRaWAN-Demo`) es pública y gratuita.
  - type: dropdown
    id: version
    attributes:
      label: Versión solicitada
      options:
        - "CubeCell-LoRaWAN-Node"
        - "CubeCell-LoRaWAN-Node-v1.1"
        - "CubeCell-LoRaWAN-Node-v1.2"
        - "CubeCell-LoRaWAN-Node-v1.3"
        - "Cubecell-htcc-ab01-2"
        - "cubecell-dht11-lora"
        - "HTCC_AB02A_LoRaWAN"
        - "HTCC_AB02A_DS18B20"
    validations:
      required: true
  - type: input
    id: uso
    attributes:
      label: Tipo de uso
      description: Personal, educativo, comercial, interno, etc.
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Contame qué querés construir, para qué y por qué necesitás esta versión.
    validations:
      required: true
  - type: checkboxes
    id: condiciones
    attributes:
      label: Condiciones
      options:
        - label: Entiendo que esta versión es privada, que no se redistribuye y que el acceso se otorga por autorización escrita.
          required: true
